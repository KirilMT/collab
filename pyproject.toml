[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "collab-runtime"
version = "0.9.0"
description = "Collaborative file locking runtime"
readme = "docs/pypi/README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
  { name = "KirilMT", email = "kiril.mt95@gmail.com" }
]
keywords = ["collaboration", "file-locking", "supabase", "cli", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Version Control",
]
dependencies = [
  "python-dotenv>=1.2.2",
  "supabase>=2.30.0",
  "httpx>=0.28.1",
  "psutil>=5.9.8",
  "plyer>=2.1.0"
]

[project.scripts]
collab = "collab.lock_client:main"
collab-watcher = "collab.live_locks_watcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["collab*"]

[tool.setuptools.package-data]
# Ship every dashboard static asset (HTML/JS/CSS) recursively so a wheel can never
# be missing a file referenced by index.html. A recursive glob means new assets are
# packaged automatically without re-listing each filename.
# hook_templates/* ships the git hooks installed by `collab init-hooks` so
# consumers get the IDE-safe hooks straight from the wheel.
collab = ["dashboard/**", "hook_templates/*"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = [".git", "__pycache__", ".venv", "venv", "build", "dist", "node_modules"]
known_first_party = ["collab"]

[tool.docformatter]
recursive = true
wrap-summaries = 88
wrap-descriptions = 88
make-summary-multi-line = false
close-quotes-on-newline = false
pre-summary-newline = false
force-wrap = false
exclude = [".git", "__pycache__", ".venv", "venv", "build", "dist"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
  ".git",
  "__pycache__",
  ".venv",
  "venv",
  "build",
  "dist",
  "*.egg-info",
  ".pytest_cache",
  "htmlcov",
]

[tool.ruff.lint]
extend-ignore = ["E203"]
select = ["E", "F", "W"]

[tool.coverage.run]
source = ["collab", "scripts"]
data_file = "${COVERAGE_FILE-.coverage}"
# Never measure the project virtualenv or any installed copy of the package.
# Tests run against the in-tree sources; an installed copy under site-packages
# would otherwise be double-counted as a separate, near-0% set of files.
omit = [
  "*/tests/*",
  "*/venv/*",
  "*/.venv/*",
  "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
# `coverage report` honors [report] omit (NOT [run] omit). Mirror the run-level
# excludes here so the CI threshold check ignores the virtualenv / installed
# duplicate even if a subprocess records it into the data file (e.g. a git hook
# subprocess that imports the installed package). This is double-measurement
# hygiene, not a coverage-threshold bypass.
omit = [
  "*/tests/*",
  "*/venv/*",
  "*/.venv/*",
  "*/site-packages/*",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true
mypy_path = "."
files = ["collab", "tests", "scripts"]
exclude = [
  ".venv/",
  "node_modules/",
  "htmlcov/",
]

[tool.testmon]
testmon_datafile = ".testmondata"
