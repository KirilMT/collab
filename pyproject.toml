[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "collab"
version = "0.2.0"
description = "Collaborative file locking runtime"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
  { name = "Collab Runtime Team" }
]
keywords = ["collaboration", "file-locking", "supabase", "cli", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Version Control",
]
dependencies = [
  "python-dotenv>=1.0.1",
  "supabase>=2.4.0",
  "httpx>=0.24.0",
  "psutil>=5.9.0",
  "plyer>=2.1.0"
]

[project.scripts]
collab = "src.lock_client:main"
collab-watcher = "src.live_locks_watcher:main"
collab-legacy = "src.main:main"

[tool.setuptools]
packages = ["src"]
package-dir = {"src" = "src"}

[tool.setuptools.package-data]
src = ["dashboard/index.html"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = [".git", "__pycache__", ".venv", "venv", "build", "dist", "node_modules"]
known_first_party = ["src"]

[tool.docformatter]
recursive = true
wrap-summaries = 88
wrap-descriptions = 88
make-summary-multi-line = false
close-quotes-on-newline = false
pre-summary-newline = false
force-wrap = false
exclude = [".git", "__pycache__", ".venv", "venv", "build", "dist"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
  ".git",
  "__pycache__",
  ".venv",
  "venv",
  "build",
  "dist",
  "*.egg-info",
  ".pytest_cache",
  "htmlcov",
]

[tool.ruff.lint]
extend-ignore = ["E203"]
select = ["E", "F", "W"]

[tool.coverage.run]
source = ["src", "scripts"]
data_file = "${COVERAGE_FILE-.coverage}"
omit = [
  "*/tests/*",
  "*/venv/*",
  "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true
mypy_path = "."
files = ["src", "tests", "scripts"]
exclude = [
  ".venv/",
  "node_modules/",
  "htmlcov/",
]

[tool.testmon]
testmon_datafile = ".testmondata"
