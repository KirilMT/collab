# .pre-commit-config.yaml
---
#
# ARCHITECTURE: Pre-commit hooks are CHECK-ONLY (verify, never modify files).
# Formatting is done EXCLUSIVELY by: python scripts/format_code.py
# This prevents stash conflicts during commit/amend workflows.
repos:
  # Check-only hooks (NEVER modify files)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-symlinks

  # Local hooks using project scripts (CHECK-ONLY mode)
  - repo: local
    hooks:
      - id: validate-code
        name: Validate Code (lint, type-check, tests)
        # Rely on the internal file filtering in validate_code.py
        # It handles selective testing cleanly via passed args.
        entry: python scripts/validate_code.py --quick
        language: system
        # Passing filenames guarantees we only test exactly what is staged,
        # preventing failures caused by unrelated/unstaged broken files.
        pass_filenames: true
        require_serial: true
        # All files in one call — prevents repeated output
        stages: [pre-commit]

      # Collab lock lifecycle, expressed pre-commit-natively so it composes
      # with validation instead of fighting over .git/hooks (#181). Acquire
      # locks for staged files at commit time (no-op when the daemon runs).
      - id: collab-acquire-locks
        name: Collab Acquire Locks (staged files)
        entry: python -m collab.githooks acquire-staged
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: pre-push-validation
        name: Pre-Push Full Validation
        entry: python scripts/validate_code.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # Release locks after successful validation; with COLLAB_PR_CLAIMS=1 the
      # pushed branch's files are retained as PR claims instead (dogfoods #181).
      - id: collab-release-locks
        name: Collab Release Locks / Retain PR Claims
        entry: python -m collab.githooks release-all
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
