---
name: Release

"on":
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: >-
    release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    name: Verify build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build tools and test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install build pytest pytest-cov

      - name: Build wheel and sdist
        run: |
          set -euo pipefail
          python -m build \
            --sdist --wheel --outdir dist/
          ls dist/*.whl 1>/dev/null 2>&1 \
            || { echo "No wheel in dist/"; exit 1; }
          ls dist/*.tar.gz 1>/dev/null 2>&1 \
            || { echo "No sdist in dist/"; exit 1; }

      - name: Install wheel
        run: |
          set -euo pipefail
          WHL=$(ls dist/*.whl | head -1)
          echo "Installing: ${WHL}"
          pip install "${WHL}"

      - name: Run tests
        run: |
          set -euo pipefail
          pytest --cov=collab --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

      - name: Check config files
        run: |
          set -euo pipefail
          test -f release-please-config.json || {
            echo "Missing release-please-config.json"
            exit 1
          }
          test -f .release-please-manifest.json || {
            echo "Missing .release-please-manifest.json"
            exit 1
          }

  release-please:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Verify release token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${RELEASE_PLEASE_TOKEN:-}" ]; then
            echo "RELEASE_PLEASE_TOKEN not set — using GITHUB_TOKEN."
            exit 0
          fi
          CODE=$(curl -sS -o /tmp/token_check.json -w "%{http_code}" \
            -H "Authorization: Bearer ${RELEASE_PLEASE_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user")
          if [ "${CODE}" != "200" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN is invalid or expired"
            echo "(HTTP ${CODE}). Rotate it under Settings → Secrets and"
            echo "variables → Actions."
            head -c 300 /tmp/token_check.json || true
            echo ""
            exit 1
          fi
          echo "Release token OK."

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          token: >-
            ${{ secrets.RELEASE_PLEASE_TOKEN
            || secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: >-
            .release-please-manifest.json
          token: >-
            ${{ secrets.RELEASE_PLEASE_TOKEN
            || secrets.GITHUB_TOKEN }}

      - name: Log release output
        if: >-
          steps.release.outputs.releases_created
        run: |
          echo "Release created:"
          echo "${{ steps.release.outputs.tag_name }}"

      - name: Checkout Release PR branch
        if: steps.release.outputs.pr
        uses: actions/checkout@v5
        with:
          ref: >-
            ${{ steps.release.outputs.pr
            && fromJson(
            steps.release.outputs.pr
            ).headBranchName
            || '' }}
          fetch-depth: 0
          token: >-
            ${{ secrets.RELEASE_PLEASE_TOKEN
            || secrets.GITHUB_TOKEN }}

      - name: Format release artifacts
        if: steps.release.outputs.pr
        working-directory: editors/vscode/collab-locks
        env:
          TARGET_BRANCH: >-
            ${{ steps.release.outputs.pr
            && fromJson(
            steps.release.outputs.pr
            ).headBranchName
            || '' }}
        run: |
          set -euo pipefail
          npm install \
            --no-fund --no-audit --silent
          cd ../../..
          npx prettier --write "**/*.md"
          git config user.name \
            "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit \
              -m "chore: auto-format release"
            git push origin \
              "HEAD:${TARGET_BRANCH}"
          else
            echo "No formatting changes."
          fi
