---
# Supabase Free tier: auto-pause after ~7 days without API/DB activity.
# This workflow performs a minimal REST read twice weekly to reset the timer.
# Secrets: SUPABASE_URL, SUPABASE_ANON_KEY (optional SUPABASE_SERVICE_ROLE_KEY).

name: Supabase Keep-Alive

"on":
  schedule:
    - cron: "0 12 * * 1,4"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase (file_locks read)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::warning::SUPABASE_URL or SUPABASE_ANON_KEY secret missing."
            echo "Add secrets under Settings → Secrets → Actions."
            exit 0
          fi
          KEY="${SUPABASE_SERVICE_ROLE_KEY:-$SUPABASE_ANON_KEY}"
          BASE="${SUPABASE_URL%/}"
          HOST="${BASE#https://}"
          HOST="${HOST#http://}"
          HOST="${HOST%%:*}"
          URL="${BASE}/rest/v1/file_locks?select=file_path&limit=1"
          echo "Pinging ${BASE} ..."

          # Pre-flight: DNS must resolve. BOTH paused and deleted Supabase
          # projects lose their *.supabase.co DNS record, so a resolution
          # failure here means the project has left the active pool. Catch it
          # with an actionable message instead of a cryptic "curl: (6)".
          if ! getent hosts "${HOST}" >/dev/null 2>&1; then
            echo "::error::DNS resolution failed for ${HOST} — the Supabase"
            echo "project is paused or deleted. Restore it in the Supabase"
            echo "dashboard (Settings → Restore project); if it no longer"
            echo "exists, recreate it, update the SUPABASE_URL /"
            echo "SUPABASE_ANON_KEY secrets, and re-run supabase/schema.sql."
            exit 1
          fi

          # Read one row. Retry transient failures; keep timeouts bounded.
          HTTP_CODE=$(curl -sS --retry 3 --retry-delay 5 --retry-all-errors \
            --connect-timeout 15 --max-time 60 \
            -o /tmp/supabase_keepalive.json \
            -w "%{http_code}" \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}" \
            -H "Accept: application/json" \
            "${URL}") || {
              echo "::error::Keep-alive failed: curl could not reach ${BASE}"
              echo "(network error). The project may be paused or unreachable."
              exit 1
            }

          echo "Response HTTP ${HTTP_CODE}"
          head -c 500 /tmp/supabase_keepalive.json || true
          echo ""
          case "${HTTP_CODE}" in
            200)
              echo "Keep-alive OK — inactivity timer reset."
              ;;
            401|403)
              echo "::error::Keep-alive failed: HTTP ${HTTP_CODE} — bad key"
              echo "or paused project. Verify SUPABASE_ANON_KEY /"
              echo "SUPABASE_SERVICE_ROLE_KEY and restore the project from the"
              echo "Supabase dashboard."
              exit 1
              ;;
            404|406)
              echo "::error::Keep-alive failed: HTTP ${HTTP_CODE} — REST"
              echo "endpoint unavailable. If the project was just recreated,"
              echo "re-run supabase/schema.sql to create the file_locks table."
              exit 1
              ;;
            5*)
              echo "::error::Keep-alive failed: HTTP ${HTTP_CODE} — Supabase"
              echo "returned a server error (project paused or maintenance)."
              exit 1
              ;;
            *)
              echo "::error::Keep-alive failed: HTTP ${HTTP_CODE}"
              exit 1
              ;;
          esac
