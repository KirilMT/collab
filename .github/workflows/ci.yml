---
name: CI Pipeline

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  python-tests:
    name: Python Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install .
          npm install --no-fund --no-audit --silent

      - name: Check import sorting with isort
        run: |
          isort src tests scripts \
            --check-only

      - name: Check code formatting with black
        run: |
          black --check src tests scripts

      - name: Check docstring formatting with docformatter
        run: |
          docformatter --check -r src tests scripts

      - name: Check documentation formatting with prettier
        run: |
          npx prettier --check "docs/**/*.md" "*.md" \
            "*.json" ".github/**/*.md" \
            "tests/**/*.md" ".agents/**/*.md"

      - name: Lint with ruff
        run: |
          ruff check src tests scripts

      - name: Lint with flake8
        run: >-
          flake8 .
          --count
          --exclude=.venv,node_modules,__pycache__,.git,.pytest_cache,htmlcov,playwright-report
          --show-source
          --statistics

      - name: Type check with mypy
        run: |
          mypy

      - name: Security scan with bandit
        run: |
          bandit -r src/ scripts/ \
            -ll

      - name: Test with pytest and generate comprehensive coverage
        run: |
          pytest \
            --cov=src \
            --cov=scripts \
            --cov-report=xml \
            tests/

      - name: Report coverage
        run: |
          coverage report --fail-under=85

      - name: Setup diff-cover
        run: |
          git checkout -b temp-branch || true
          git fetch origin \
            ${{ github.event.pull_request.base.ref || 'main' }}:\
            ${{ github.event.pull_request.base.ref || 'main' }}

      - name: Check diff coverage
        if: github.event_name == 'pull_request'
        run: |
          diff-cover coverage.xml \
            --compare-branch=origin/${{ github.event.pull_request.base.ref }} \
            --fail-under=92
