---
name: Publish Release

"on":
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}
  repository_dispatch:
    types: [trigger-publish]

concurrency:
  group: >-
    publish-${{
    github.ref_name || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build-verify-publish:
    name: Build, verify, publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build tools
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wheel and sdist
        run: |
          set -euo pipefail
          python -m build \
            --sdist --wheel --outdir dist/
          ls dist/*.whl 1>/dev/null 2>&1 \
            || { echo "No wheel found"; exit 1; }
          ls dist/*.tar.gz 1>/dev/null 2>&1 \
            || { echo "No sdist found"; exit 1; }

      - name: Packaging smoke check
        run: |
          set -euo pipefail
          python -m venv .venv.verify
          .venv.verify/bin/pip install \
            --upgrade pip
          .venv.verify/bin/pip install dist/*.whl
          .venv.verify/bin/python <<'PY'
          import importlib, sys
          try:
              mod = importlib.import_module('collab')
              ver = getattr(
                  mod, '__version__', 'unknown'
              )
              print(f"collab version: {ver}")
          except ImportError as e:
              print(f"Import error: {e}",
                    file=sys.stderr)
              sys.exit(1)
          PY
          if [ -f .venv.verify/bin/collab ]; then
            .venv.verify/bin/collab --help
          else
            echo "CLI not installed; skipping"
          fi

      - name: Generate SBOM and requirements
        run: |
          set -euo pipefail
          .venv.verify/bin/pip install \
            pip-licenses
          .venv.verify/bin/pip-licenses \
            --format=json \
            > dist/sbom-deps.json
          .venv.verify/bin/pip freeze \
            > dist/requirements-venv.txt

      - name: Sign artifacts
        env:
          GPG_PRIVATE_KEY: >-
            ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: >-
            ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: >-
            ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "GPG key not set; skip signing."
            exit 0
          fi
          echo "$GPG_PRIVATE_KEY" > private.key
          trap 'rm -f private.key' EXIT
          gpg --batch --import private.key
          gpg --list-secret-keys
          for f in dist/*; do
            [ -f "$f" ] || continue
            gpg --batch --yes \
              --pinentry-mode loopback \
              --passphrase \
                "${GPG_PASSPHRASE}" \
              --local-user \
                "${GPG_KEY_ID}" \
              --armor --detach-sign \
              --output "${f}.asc" "$f"
          done

      - name: Resolve tag name
        id: tag
        run: |
          set -euo pipefail
          EVT="${{ github.event_name }}"
          if [ "$EVT" = "repository_dispatch" ]
          then
            TAG="${{
              github.event.client_payload.tag
            }}"
            if [ -z "$TAG" ]; then
              echo "No tag in dispatch payload"
              exit 1
            fi
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "name=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create or reuse GitHub Release
        if: >-
          startsWith(github.ref, 'refs/tags/v')
          || github.event_name == 'repository_dispatch'
          || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: >-
            ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: >-
            ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" \
            >/dev/null 2>&1; then
            echo "Release $TAG_NAME exists."
          else
            gh release create "$TAG_NAME" \
              --title "$TAG_NAME" \
              --generate-notes \
              --verify-tag
          fi

      - name: Attach dist artifacts to release
        if: >-
          startsWith(github.ref, 'refs/tags/v')
          || github.event_name == 'repository_dispatch'
          || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: >-
            ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: >-
            ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          ls dist/* 1>/dev/null 2>&1 \
            || { echo "No artifacts"; exit 1; }
          gh release upload \
            "$TAG_NAME" dist/* --clobber

      - name: Upload dist artifacts (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/*

      - name: Publish to registry
        if: >-
          startsWith(github.ref, 'refs/tags/v')
          || github.event_name == 'repository_dispatch'
          || github.event_name == 'workflow_dispatch'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.REGISTRY_API_TOKEN }}
          TWINE_REPOSITORY_URL: >-
            ${{ vars.REGISTRY_URL
            || secrets.REGISTRY_URL
            || 'https://upload.pypi.org/legacy/'
            }}
        run: |
          set -euo pipefail
          if [ -z "${TWINE_PASSWORD:-}" ]; then
            echo "Registry token not set; skip."
            exit 1
          fi
          ls dist/*.whl 1>/dev/null 2>&1 \
            || { echo "No wheel"; exit 1; }
          ls dist/*.tar.gz 1>/dev/null 2>&1 \
            || { echo "No sdist"; exit 1; }
          python -m twine upload \
            --skip-existing \
            --verbose \
            dist/*.whl dist/*.tar.gz || {
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 0 ]; then
              echo "Upload successful"
            else
              echo "Upload failed with code $EXIT_CODE"
              echo "This may be due to version already existing on PyPI"
              echo "Check: https://pypi.org/project/collab-runtime/"
              exit $EXIT_CODE
            fi
          }

  build-verify-publish-extension:
    name: Build and publish VS Code extension
    runs-on: ubuntu-latest
    environment: production
    needs: build-verify-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: >-
            vscode-extension/collab-locks/package-lock.json

      - name: Install dependencies
        working-directory: >-
          vscode-extension/collab-locks
        run: npm ci

      - name: Build VSIX package
        working-directory: >-
          vscode-extension/collab-locks
        run: |
          set -euo pipefail
          ln -sf ../../LICENSE LICENSE
          npx vsce package
          ls *.vsix 1>/dev/null 2>&1 \
            || { echo "No .vsix found"; exit 1; }

      - name: Resolve tag name
        id: tag
        run: |
          set -euo pipefail
          EVT="${{ github.event_name }}"
          if [ "$EVT" = "repository_dispatch" ]
          then
            TAG="${{
              github.event.client_payload.tag
              || github.sha
            }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "name=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Attach VSIX to GitHub Release
        if: >-
          startsWith(github.ref, 'refs/tags/v')
          || github.event_name == 'repository_dispatch'
          || github.event_name == 'workflow_dispatch'
        working-directory: >-
          vscode-extension/collab-locks
        env:
          GITHUB_TOKEN: >-
            ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: >-
            ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          VSIX=$(ls *.vsix 2>/dev/null | head -1)
          if [ -n "$VSIX" ]; then
            gh release upload \
              "$TAG_NAME" "$VSIX" --clobber
          else
            echo "No VSIX file found."
            exit 1
          fi
