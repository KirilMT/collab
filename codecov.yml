---
# Codecov configuration.
#
# Pin the patch/project status targets to the SAME thresholds enforced locally
# by scripts/validate_code.py and in CI (.github/workflows/ci.yml):
#   - diff/patch coverage on changed lines >= 95%  (AGENTS.md, immutable)
#   - total project coverage            >= 85%  (AGENTS.md, immutable)
#
# Without this file Codecov falls back to `target: auto`, which sets the patch
# target to the base commit's coverage. That silently diverges from the
# documented gate, so a patch can pass `diff-cover --fail-under=95` locally and
# in CI yet still fail the `codecov/patch` status check (or vice versa). Pinning
# the targets keeps local validation and Codecov in lockstep.
coverage:
  precision: 2
  round: down
  status:
    project:
      default:
        target: 85%
        threshold: 1%
        informational: false
    patch:
      default:
        target: 95%
        threshold: 0%
        informational: false

comment:
  layout: "reach, diff, flags, files"
  require_changes: true
